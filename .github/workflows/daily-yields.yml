name: Daily bond yields snapshot

on:
  schedule:
    # Daily at 18:00 UTC — after US/EU markets have published the day's data
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Fetch US + UK daily yields
        run: python scripts/fetch_daily_yields.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-yields.json
          if git diff --cached --quiet; then
            echo "No changes to daily-yields.json"
          else
            git commit -m "Daily yields snapshot $(date -u +%F)"
            git push
          fi
